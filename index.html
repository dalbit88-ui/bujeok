<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>부적</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f8f1df;
      color: #3b2416;
      text-align: center;
    }

    .container {
      max-width: 700px;
      margin: 0 auto;
      padding: 50px 20px;
    }

    h1 {
      font-size: 42px;
      margin-bottom: 10px;
    }

    .intro {
      font-size: 18px;
      margin-bottom: 30px;
    }

    .mandala {
      width: 260px;
      max-width: 80%;
      border-radius: 12px;
      margin: 20px auto;
      display: block;
    }

    .start-button {
      display: inline-block;
      padding: 15px 35px;
      background: #8b4513;
      color: white;
      text-decoration: none;
      border-radius: 30px;
      font-size: 18px;
      border: none;
      cursor: pointer;
    }

    .start-button:hover {
      opacity: 0.85;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>🔮 부적</h1>

    <p class="intro">
      나에게 필요한 부적을 선택해 보세요.
    </p>

    <img src="mandala.png" alt="만다라" class="mandala">

    <button class="start-button" onclick="alert('부적 선택을 시작합니다.')">
      부적 선택하기
    </button>

  </div>

</body>
</html>
